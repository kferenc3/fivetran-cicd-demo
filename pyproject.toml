[project]
name = "fivetran-cicd-demo"
version = "0.1.0"
description = "CI/CD demonstration for multiple Fivetran Connector SDK connectors"
readme = "README.md"
authors = [
    { name = "Ferenc Kiss", email = "kissferenc1988@outlook.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "fivetran-connector-sdk>=2.11.0",
]

[project.scripts]
fivetran-cicd-demo = "fivetran_cicd_demo:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package=false
